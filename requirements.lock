# Pinned, air-gapped dependency set for asset-dashboard.
# Install offline from a pre-built local wheelhouse (no PyPI access at install time):
#
#   uv pip install --no-index --find-links .\wheelhouse -r requirements.lock
#
# To (re)build the wheelhouse on a machine WITH internet access, then transfer
# the wheelhouse/ directory to the air-gapped host:
#
#   uv pip download -r requirements.lock -d wheelhouse
#
